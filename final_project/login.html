<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Pro.Feeding</title>

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">


</head>

<body class="login-bg">

<header class="confirm-site-header">
  <div class="logo">
    <span class="brand-primary">Pro.</span><span class="brand-secondary">Feeding</span>
    <img src="./images/paw-icon.png" class="logo-badge" alt="">
  </div>

  <nav class="main-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="book.html">Book a Visit</a></li>
      <li><a href="owner-dashboard.html">I am Cat Owner</a></li>
      <li><a href="feeder-dashboard.html">I am Feeder</a></li>
    </ul>
  </nav>
</header>

<section class="login-wrapper">
  <div class="login-card">
    <h2>Login</h2>
    <p class="login-sub">Access your dashboard and manage your bookings.</p>

    <div class="login-form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail">
    </div>

    <div class="login-form-group">
      <label>Password</label>
      <input type="password" id="loginPassword">
    </div>

    <button class="login-btn" id="loginBtn">Login</button>

    <p class="login-switch">
      New here? <a href="signup.html">Create an Account</a>
    </p>
  </div>
</section>

<footer class="black-footer">
  <div class="black-footer-logo">
      <span class="black-footer-text">Pro.Feeding</span>
      <img src="./images/footer-icon.png" class="logo-icon">
  </div>

  <div class="black-footer-links">
      <a href="#">About</a>
      <a href="#">Contact</a>
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
  </div>

  <p class="black-footer-copy">© 2025 Pro.Feeding. All rights reserved.</p>
</footer>

<script type="module" src="auth.js"></script>

</body>
</html>
